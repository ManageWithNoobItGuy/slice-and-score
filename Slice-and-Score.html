<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slice &amp; Score · Python Indexing &amp; Slicing</title>
<meta name="description" content="A football-themed, step-by-step lesson on Python indexing and slicing, with a project and a quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0d3b2a; --pitch-2:#12523a; --grass:#1f7a4f; --grass-2:#25895a;
  --chalk:#f7f5ef; --paper:#f3f1ea; --card:#ffffff; --ink:#14201a; --muted:#5b6b62;
  --line:#dcd8cc; --line-2:#e9e6dc;
  --yellow:#ffc93c; --yellow-ink:#5a4100; --red:#d93f3f; --red-bg:#fdecec; --green:#1d9a5b; --green-bg:#e3f5ea;
  --gk:#f2b705; --def:#2f6fdb; --mid:#1d9a5b; --fwd:#d93f3f;
  --code-bg:#0f1f18; --code-ink:#e6f2ea;
  --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(10,40,25,.25);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:84px}
button{font:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--pitch);color:var(--chalk);display:flex;align-items:center;gap:16px;padding:10px 20px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.crest{width:42px;height:42px;border-radius:50%;background:var(--chalk);display:grid;place-items:center;font-size:24px;box-shadow:inset 0 0 0 3px var(--yellow);flex:none}
.brand-title{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand-sub{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoreboard{display:flex;align-items:center;gap:8px;background:#06231a;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 12px;font-family:var(--display);text-transform:uppercase}
.sb-team{font-size:14px;opacity:.8;letter-spacing:.08em}
.sb-num{font-size:26px;font-weight:800;color:var(--yellow);min-width:1.4ch;text-align:center;font-variant-numeric:tabular-nums}
.sb-label{font-size:13px;opacity:.7}
.sb-num.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--yellow);border-color:#e8b21f;color:#2d2300}
.btn.primary:hover{background:#ffd45e}
.btn.dark{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
.btn.dark:hover{background:var(--pitch-2)}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:62px;z-index:25;background:var(--chalk);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px 7px;display:flex;flex-direction:column;align-items:center;min-width:92px;color:var(--muted)}
.tab b{font-family:var(--display);font-size:17px;line-height:1.1;color:var(--ink)}
.tab span{font-size:12px;white-space:nowrap}
.tab.active{background:var(--pitch);border-color:var(--pitch);color:#cfe3d8}
.tab.active b{color:var(--yellow)}
.tab.done b::after{content:" ✓";color:var(--green)}
.tab.active.done b::after{color:#7ee2a8}

/* ---------- layout ---------- */
main{max-width:1060px;margin:0 auto;padding:24px 20px 40px}
.mission-tag{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--grass)}
.mission-title{font-size:44px;line-height:1.02;font-weight:800;text-transform:uppercase;margin:4px 0 8px}
.story{font-size:18px;max-width:760px;color:#2c3a33;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:24px;text-transform:uppercase;font-weight:800}
.card-h .sub{font-size:14px;color:var(--muted)}
.kicker{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* tactics board */
.board{background:var(--grass);border-radius:var(--radius);padding:18px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px;
  background-image:repeating-linear-gradient(90deg,var(--grass) 0 80px,var(--grass-2) 80px 160px)}
.board::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:8px;pointer-events:none}
.board::after{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border:2px solid rgba(255,255,255,.25);border-radius:50%;pointer-events:none}
.board-h{position:relative;z-index:1;display:flex;justify-content:space-between;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;opacity:.9;padding:0 8px 10px}
.board-flow{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.board-step{background:rgba(6,35,26,.55);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(2px)}
.board-step .big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--yellow);word-break:break-word}
.board-step .lbl{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;margin-top:4px}
.board-step .s{font-size:13.5px;opacity:.85}
.board-arrow{align-self:center;font-size:24px;opacity:.85}
.think{position:relative;z-index:1;margin:14px 8px 0;background:var(--chalk);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700}
.think::before{content:"🧠 Think · ";color:var(--grass)}

/* rules */
.rules-grid{display:grid;grid-template-columns:1fr;gap:14px}
.rules-grid .rule-list{display:grid;grid-template-columns:1fr 1fr}
.card,.chal{scroll-margin-top:140px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.6}
/* syntax colours (lesson code blocks + project editor) */
:is(pre.code,.code-hl) .c{color:#8e9c95;font-style:italic}
:is(pre.code,.code-hl) .s{color:#ffd479}
:is(pre.code,.code-hl) .n{color:#8fd3ff}
:is(pre.code,.code-hl) .k{color:#ffa77a}
:is(pre.code,.code-hl) .kw{color:#ff9fd0}
:is(pre.code,.code-hl) .f{color:#7ee2a8}
:is(pre.code,.code-hl) .b{color:#c7d6ce}
.rule-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rule-list li{background:var(--paper);border-left:4px solid var(--yellow);border-radius:8px;padding:9px 12px;font-size:15px}

/* ---------- viz strips ---------- */
.viz{margin-bottom:14px}
.viz-label{font-family:var(--mono);font-size:13.5px;color:var(--muted);margin-bottom:6px;word-break:break-all}
.viz-label b{color:var(--ink)}
.track{position:relative;display:flex;flex-wrap:wrap;gap:6px;padding:30px 6px 8px;background:linear-gradient(#eaf4ee,#dcebe2);border-radius:12px;border:1px solid #cfe1d6}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:4px 2px 2px;border-radius:10px;transition:background .2s,transform .2s,opacity .2s}
.chip .ix{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#24493a;line-height:1.3}
.chip .ix-neg{color:#9a5b16;font-weight:600}
.chip .nm{font-size:13px;font-weight:800;line-height:1.2}
.jersey{position:relative;width:42px;height:40px}
.jersey svg{width:100%;height:100%;display:block}
.jersey b{position:absolute;inset:9px 0 0;text-align:center;font-family:var(--display);font-weight:800;color:#fff;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pos-gk .jersey svg{fill:var(--gk)} .pos-gk .jersey b{color:#3d2e00;text-shadow:none}
.pos-def .jersey svg{fill:var(--def)} .pos-mid .jersey svg{fill:var(--mid)} .pos-fwd .jersey svg{fill:var(--fwd)}
.pos-sub .jersey svg{fill:#7b8580}
.tile{width:40px;height:44px;border-radius:8px;background:#fff;border:2px solid #b9d0c2;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:20px;margin:2px 0}
.tile.sp{color:#9fb3a7;font-weight:500}
.tile.W{background:var(--green);border-color:#147a47;color:#fff}
.tile.D{background:#8d969a;border-color:#6f777b;color:#fff}
.tile.L{background:var(--red);border-color:#b02d2d;color:#fff}
.chip.dim{opacity:.38}
.chip.picked{background:#fff6d6;box-shadow:0 0 0 2px var(--yellow);opacity:1}
.chip .ord{position:absolute;top:-8px;right:-4px;background:var(--pitch);color:var(--yellow);font-family:var(--display);font-weight:800;font-size:12px;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.chip.is-start::before,.chip.is-stop::before{position:absolute;bottom:-17px;font-size:10.5px;font-weight:800;letter-spacing:.06em;font-family:var(--display);white-space:nowrap}
.chip.is-start::before{content:"START";color:var(--grass)}
.chip.is-stop{box-shadow:0 0 0 2px var(--red) inset}
.chip.is-stop::before{content:"STOP ✋";color:var(--red)}
.track.has-markers{padding-bottom:22px}
.endzone{align-self:center;font-family:var(--display);font-size:12px;letter-spacing:.08em;color:#6b8577;border:2px dashed #a9c4b4;border-radius:8px;padding:12px 6px;text-transform:uppercase;min-width:54px;text-align:center}
.endzone.hit{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.endzone.stop-here{border-color:var(--red);color:var(--red)}
.ball{position:absolute;left:0;top:0;width:24px;height:24px;font-size:22px;line-height:24px;text-align:center;transition:transform .32s cubic-bezier(.3,.7,.3,1.2);pointer-events:none;z-index:3;opacity:0}
.ball.on{opacity:1}
.viz-result{margin-top:8px;font-family:var(--mono);font-size:14px;min-height:22px;color:var(--muted)}
.viz-result b{color:var(--ink)}
.viz-result.err b{color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* league table */
.tbl{border-radius:12px;overflow:hidden;border:1px solid #cfe1d6;background:#fff;position:relative}
.trow{display:grid;grid-template-columns:44px 44px 1fr 90px;align-items:center;border-top:1px solid var(--line-2);transition:background .2s,opacity .2s}
.trow.head{border-top:0;background:#eaf4ee;font-family:var(--mono);font-size:12.5px;color:#24493a;font-weight:700}
.trow > span{padding:7px 10px}
.trow .ix{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#24493a;text-align:center}
.trow .ix-neg{color:#9a5b16}
.trow .cell{font-weight:700}
.trow .cell.pts{font-family:var(--mono);text-align:right}
.trow.dim{opacity:.35}
.trow.picked{background:#fff6d6}
.cell.hit{background:var(--yellow);border-radius:6px}
.trow .zone{font-size:11px;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:999px}
.zone.cl{background:#e0ebff;color:#2350a8}.zone.rel{background:var(--red-bg);color:var(--red)}

/* console */
.console{background:var(--code-bg);border-radius:12px;padding:12px;color:var(--code-ink)}
.console-log{font-family:var(--mono);font-size:13.5px;max-height:220px;overflow:auto;margin-bottom:8px}
.console-log .in{color:#8fd3ff}
.console-log .out{color:#e6f2ea;white-space:pre-wrap}
.console-log .er{color:#ff8f8f;white-space:pre-wrap}
.console-log .tip{color:#ffd479;font-family:var(--body);font-size:13.5px;margin:2px 0 8px}
.console-row,.chal-row{display:flex;gap:8px;align-items:center}
.prompt-sym{font-family:var(--mono);color:var(--yellow);font-weight:700}
.code-in{flex:1;min-width:0;font-family:var(--mono);font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid #2c4a3c;background:#16302a;color:#fff}
.code-in::placeholder{color:#7f9c8e}
.chal .code-in{background:#fff;color:var(--ink);border:2px solid var(--line)}
.chal .code-in::placeholder{color:#9aa79f}
.chal .prompt-sym{color:var(--grass)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{font-family:var(--mono);font-size:12.5px;background:#1d3a30;color:#cde7d8;border:1px solid #2c4a3c;border-radius:8px;padding:4px 8px}

/* slice lab */
.lab{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end;margin-bottom:12px}
.lab .lab-var{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stepper .kicker{display:block;margin-bottom:4px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .val{font-family:var(--mono);font-weight:800;font-size:20px;min-width:3ch;text-align:center}
.stepper .val.blank{color:#9aa79f}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.stepper .blank-btn{width:auto;padding:0 8px;font-size:12px}
.lab-code{font-family:var(--mono);font-size:20px;font-weight:800;background:var(--code-bg);color:var(--yellow);border-radius:12px;padding:10px 14px;text-align:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-family:var(--mono);font-size:13px}
.seg button.on{background:var(--pitch);color:var(--yellow)}

/* predict */
.predict{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--paper)}
.predict .q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.predict .q code{background:var(--code-bg);color:var(--yellow);padding:4px 10px;border-radius:8px;font-size:15px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-family:var(--mono);font-size:14px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--grass)}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.good::before{content:"✅ ";}
.fb.bad::before{content:"🟨 ";}
.replay{margin-left:6px}

/* challenges */
.chal{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;transition:border-color .2s}
.chal.solved{border-color:var(--green);background:linear-gradient(#fff,#f3fbf6)}
.chal-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.chal-num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pitch);color:var(--yellow);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.chal.solved .chal-num{background:var(--green);color:#fff}
.chal-text{flex:1}
.chal-text p{margin:0;font-weight:700}
.stars{font-size:13px;color:#c99400;letter-spacing:.1em}
.rules-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rtag{font-size:12px;font-weight:700;background:#fff3cc;color:var(--yellow-ink);border:1px solid #f1d98b;border-radius:999px;padding:1px 8px}
.chal-out{font-family:var(--mono);font-size:14px;margin-top:8px;white-space:pre-wrap}
.chal-out .val{color:var(--ink)}
.chal-out .err{color:var(--red)}
.chal-msg{margin-top:6px;font-size:14.5px;font-weight:700}
.chal-msg.good{color:var(--green)}
.chal-msg.near{color:#a66b00}
.chal-msg.bad{color:var(--red)}
.chal-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint{background:#fff9e6;border:1px dashed #e8c45c;border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:8px}
.hint code{background:#fff;padding:1px 5px;border-radius:5px}

/* checklist */
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border-radius:10px;background:var(--paper)}
.check input{width:20px;height:20px;accent-color:var(--grass);flex:none;margin-top:2px}
.checkpoint{margin-top:12px;border-radius:12px;background:var(--pitch);color:var(--chalk);padding:12px 16px;display:flex;gap:12px;align-items:center}
.checkpoint .kicker{color:var(--yellow)}

/* coach notes */
.coach{display:none;border:2px solid var(--yellow);background:#fffbea}
body.coach-on .coach{display:block}
.coach h2::before{content:"📋 "}
.coach dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:8px 16px}
.coach dt{font-weight:800;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--yellow-ink)}
.coach dd{margin:0}
.coach ul{margin:0;padding-left:18px}

/* project */
.proj-grid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;display:flex;gap:10px}
.task .ico{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--line-2)}
.task.ok{border-color:var(--green);background:#f3fbf6}
.task.ok .ico{background:var(--green);color:#fff}
.task.warn{border-color:#e8b21f;background:#fffbea}
.task.warn .ico{background:var(--yellow)}
.task.bad .ico{background:var(--red-bg);color:var(--red)}
.task .ttl{display:block;font-size:14.5px}
.task p{margin:2px 0 0;font-size:13.5px;color:#36463e}
.task code{background:var(--paper);padding:0 4px;border-radius:4px}
.task .tmsg{font-size:12.5px;font-weight:700;margin-top:3px}
.task.bonus{border-style:dashed}
.editor{display:flex;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid #23392f}
.gutter{padding:12px 8px;color:#5f7f70;font-family:var(--mono);font-size:13.5px;line-height:1.6;text-align:right;user-select:none;min-width:40px;background:#0b1913;overflow:hidden;white-space:pre}
.code-wrap{position:relative;flex:1;min-width:0;display:flex}
.code-hl,.editor textarea{font-family:var(--mono);font-size:13.5px;line-height:1.6;padding:12px;tab-size:4;white-space:pre;letter-spacing:0;font-variant-ligatures:none}
.code-hl{position:absolute;inset:0;margin:0;overflow:hidden;color:var(--code-ink);pointer-events:none}
.editor textarea{position:relative;flex:1;width:100%;border:0;resize:vertical;min-height:520px;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#ffd479;outline:none;overflow:auto}
.editor textarea::selection{background:rgba(255,212,121,.28);-webkit-text-fill-color:transparent}
.proj-bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.terminal{background:#06120d;color:#d6f5e3;font-family:var(--mono);font-size:13.5px;border-radius:12px;padding:12px 14px;min-height:120px;white-space:pre-wrap}
.terminal .er{color:#ff8f8f}
.terminal .muted{color:#6f8f80}
.meter{height:12px;border-radius:999px;background:var(--line-2);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--yellow));width:0;transition:width .4s}
.data-box{font-size:13.5px}

/* quiz */
.quiz-card{max-width:760px}
.qdots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.qdots i{width:22px;height:8px;border-radius:999px;background:var(--line)}
.qdots i.now{background:var(--pitch)}
.qdots i.r{background:var(--green)}
.qdots i.w{background:var(--red)}
.qtext{font-size:19px;font-weight:800;margin:6px 0 12px}
.qtext code{background:var(--code-bg);color:var(--yellow);padding:2px 8px;border-radius:6px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopts .opt{font-size:15px;padding:10px 14px}
.qexp{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--paper);display:none}
.qexp.show{display:block}
.result-hero{text-align:center;padding:18px}
.result-hero .trophy{font-size:64px}
.result-hero .big{font-family:var(--display);font-size:56px;font-weight:800}
.review{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.review li{padding:8px 12px;border-radius:10px;background:var(--paper);font-size:14.5px}
.review li.w{background:var(--red-bg)}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chalk);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px}
.progress{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.progress .bar{height:6px;border-radius:999px;background:var(--line-2);margin-top:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--grass);transition:width .3s}

/* goal flash */
.goal-flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;opacity:0}
.goal-flash span{font-family:var(--display);font-weight:800;font-size:clamp(64px,14vw,150px);color:var(--yellow);text-shadow:0 4px 0 var(--pitch),0 10px 30px rgba(0,0,0,.35);transform:scale(.4)}
.goal-flash.show{animation:fade 1.1s ease-out}
.goal-flash.show span{animation:pop 1.1s cubic-bezier(.2,.9,.3,1.3)}
@keyframes fade{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg)}30%{transform:scale(1.1) rotate(2deg)}60%{transform:scale(1)}100%{transform:scale(1.05)}}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:24px}
.foot-note button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  .rules-grid,.proj-grid,.rules-grid .rule-list{grid-template-columns:1fr}
  .board-flow{grid-template-columns:1fr}
  .board-arrow{transform:rotate(90deg);justify-self:center}
  .lab{grid-template-columns:1fr 1fr}
  .coach dl{grid-template-columns:1fr}
}
@media (max-width:560px){
  .topbar{padding:8px 16px;gap:8px;height:54px}
  .brand-sub,.sb-label,.coach-lbl{display:none}
  .brand-title{font-size:19px;white-space:nowrap}
  .crest{width:32px;height:32px;font-size:18px}
  .scoreboard{padding:2px 10px}
  .sb-num{font-size:22px}
  .tabs{top:54px;padding:8px 16px}
  .tab{min-width:76px;padding:5px 8px 6px}
  main{padding:18px 16px 32px}
  .mission-title{font-size:34px}
  .story{font-size:16px}
  .card{padding:14px}
  .chip{min-width:46px}
  .jersey{width:36px;height:34px}
  .jersey b{font-size:14px;inset:7px 0 0}
  .tile{width:30px;height:36px;font-size:16px}
  .trow{grid-template-columns:36px 36px 1fr 64px}
  .bottombar{padding:8px 16px}
  .editor textarea{min-height:420px}
  .editor textarea,.code-hl{font-size:12.5px}
  .gutter{font-size:12.5px}
}

<body>
<header class="topbar">
  <div class="brand"><div class="crest" aria-hidden="true">⚽</div>
    <div style="min-width:0"><div class="brand-title">Slice &amp; Score</div><div class="brand-sub">Python Indexing &amp; Slicing · Football Academy</div></div></div>
  <div class="scoreboard" aria-live="polite" title="Goals = solved orders + project tasks + best quiz score"><span class="sb-team">You</span><span class="sb-num" id="sbGoals">0</span><span class="sb-label">goals</span></div>
  <button id="coachToggle" class="btn ghost small" aria-pressed="false">📋 <span class="coach-lbl">Coach notes: off</span></button>
</header>
<nav class="tabs" id="tabs" aria-label="Missions"></nav>
<main id="main"></main>
<footer class="bottombar">
  <button class="btn" id="prevBtn">← Back</button>
  <div class="progress"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>
  <button class="btn primary" id="nextBtn">Next →</button>
</footer>
<div id="goalFlash" class="goal-flash" aria-hidden="true"><span>GOAL!</span></div>
<script>
/* Mini-Python engine for "Slice & Score".
   Supports: ints, floats, strings, f-strings, lists, True/False/None,
   indexing, slicing (with step), + - * / // %, comparisons, in,
   len/int/str/print/sum/max/min/abs/list, a few str/list methods,
   assignment statements and print(). Records index/slice "traces"
   so the UI can animate what Python picked. */
(function (root) {
  'use strict';

  class PyError extends Error {
    constructor(type, msg) { super(type + ': ' + msg); this.pyType = type; this.pyMsg = msg; this.line = null; }
  }
  class PyFloat { constructor(v) { this.v = v; } }

  const UNSUPPORTED = ['for', 'while', 'if', 'elif', 'else', 'def', 'class', 'import', 'from',
    'return', 'lambda', 'try', 'except', 'with', 'and', 'or', 'del', 'global', 'pass', 'break', 'continue'];

  /* ---------------- tokenizer ---------------- */
  function tokenize(src) {
    const toks = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
      if (c === '#') { while (i < src.length && src[i] !== '\n') i++; continue; }
      let isF = false;
      if ((c === 'f' || c === 'F') && (src[i + 1] === '"' || src[i + 1] === "'")) { isF = true; i++; }
      const q = src[i];
      if (q === '"' || q === "'") {
        const start = isF ? i - 1 : i;
        let j = i + 1, s = '';
        while (j < src.length && src[j] !== q) {
          if (src[j] === '\\' && j + 1 < src.length) {
            const n = src[j + 1];
            s += n === 'n' ? '\n' : n === 't' ? '\t' : n;
            j += 2; continue;
          }
          if (src[j] === '\n') break;
          s += src[j]; j++;
        }
        if (j >= src.length || src[j] !== q) throw new PyError('SyntaxError', 'unterminated string literal (a quote is missing)');
        toks.push({ t: isF ? 'fstr' : 'str', v: s, pos: start });
        i = j + 1; continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9_]/.test(src[j])) j++;
        let isFloat = false;
        if (src[j] === '.' && /[0-9]/.test(src[j + 1] || '')) {
          isFloat = true; j++;
          while (j < src.length && /[0-9]/.test(src[j])) j++;
        }
        const text = src.slice(i, j).replace(/_/g, '');
        if (/[A-Za-z_]/.test(src[j] || '')) throw new PyError('SyntaxError', 'invalid decimal literal');
        toks.push({ t: 'num', v: isFloat ? new PyFloat(parseFloat(text)) : parseInt(text, 10), pos: i });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        toks.push({ t: 'name', v: src.slice(i, j), pos: i });
        i = j; continue;
      }
      const two = src.slice(i, i + 2);
      if (['==', '!=', '<=', '>=', '//', '+=', '-=', '**'].includes(two)) { toks.push({ t: 'op', v: two, pos: i }); i += 2; continue; }
      if ('[](),:+-*/%<>=.{}'.includes(c)) { toks.push({ t: 'op', v: c, pos: i }); i++; continue; }
      if ('“”‘’'.includes(c)) throw new PyError('SyntaxError', `invalid character '${c}' — use straight quotes " or '`);
      throw new PyError('SyntaxError', `invalid character '${c}'`);
    }
    toks.push({ t: 'eof', pos: src.length });
    return toks;
  }
  function tokText(k) { return k.t === 'eof' ? 'end of line' : k.t === 'str' ? JSON.stringify(k.v) : String(k.v instanceof PyFloat ? k.v.v : k.v); }

  /* ---------------- parser ---------------- */
  function Parser(toks) { this.t = toks; this.p = 0; }
  Parser.prototype = {
    peek() { return this.t[this.p]; },
    isOp(v) { const k = this.t[this.p]; return k.t === 'op' && k.v === v; },
    eat(v) { if (this.isOp(v)) { this.p++; return true; } return false; },
    expect(v, opener) {
      if (this.isOp(v)) { this.p++; return; }
      const k = this.peek();
      if (k.t === 'eof' && opener) throw new PyError('SyntaxError', `'${opener}' was never closed`);
      if (k.t === 'name' && UNSUPPORTED.includes(k.v)) throw new PyError('SimulatorLimit', `'${k.v}' isn't part of this training ground — try it in real Python!`);
      throw new PyError('SyntaxError', `invalid syntax near ${tokText(k)}`);
    },
    parseExpr() { return this.parseCmp(); },
    parseCmp() {
      const l = this.parseAdd();
      const k = this.peek();
      if (k.t === 'op' && ['==', '!=', '<', '>', '<=', '>='].includes(k.v)) { this.p++; return { type: 'cmp', op: k.v, l, r: this.parseAdd() }; }
      if (k.t === 'name' && k.v === 'in') { this.p++; return { type: 'cmp', op: 'in', l, r: this.parseAdd() }; }
      if (k.t === 'name' && k.v === 'not' && this.t[this.p + 1].t === 'name' && this.t[this.p + 1].v === 'in') {
        this.p += 2; return { type: 'cmp', op: 'not in', l, r: this.parseAdd() };
      }
      return l;
    },
    parseAdd() {
      let l = this.parseMul();
      for (;;) {
        const k = this.peek();
        if (k.t === 'op' && (k.v === '+' || k.v === '-')) { this.p++; l = { type: 'bin', op: k.v, l, r: this.parseMul() }; }
        else return l;
      }
    },
    parseMul() {
      let l = this.parseUnary();
      for (;;) {
        const k = this.peek();
        if (k.t === 'op' && ['*', '/', '//', '%'].includes(k.v)) { this.p++; l = { type: 'bin', op: k.v, l, r: this.parseUnary() }; }
        else return l;
      }
    },
    parseUnary() {
      if (this.isOp('-')) { this.p++; return { type: 'neg', e: this.parseUnary() }; }
      if (this.isOp('+')) { this.p++; return this.parseUnary(); }
      return this.parsePostfix();
    },
    parsePostfix() {
      let e = this.parseAtom();
      for (;;) {
        if (this.isOp('[')) {
          this.p++;
          const idx = this.parseSubscript();
          this.expect(']', '[');
          e = { type: 'sub', obj: e, idx };
        } else if (this.isOp('(')) {
          this.p++;
          const args = [], kw = {};
          while (!this.isOp(')')) {
            const k = this.peek(), k2 = this.t[this.p + 1];
            if (k.t === 'name' && k2.t === 'op' && k2.v === '=') { this.p += 2; kw[k.v] = this.parseExpr(); }
            else args.push(this.parseExpr());
            if (!this.eat(',')) break;
          }
          this.expect(')', '(');
          e = { type: 'call', fn: e, args, kw };
        } else if (this.isOp('.')) {
          this.p++;
          const k = this.peek();
          if (k.t !== 'name') throw new PyError('SyntaxError', 'invalid syntax after .');
          this.p++;
          e = { type: 'attr', obj: e, name: k.v };
        } else return e;
      }
    },
    parseSubscript() {
      let start = null, stop = null, step = null;
      if (this.isOp(']')) throw new PyError('SyntaxError', 'invalid syntax — the [ ] is empty');
      if (!this.isOp(':')) start = this.parseExpr();
      if (!this.isOp(':')) return start;
      this.p++;
      if (!this.isOp(':') && !this.isOp(']')) stop = this.parseExpr();
      if (this.eat(':')) { if (!this.isOp(']')) step = this.parseExpr(); }
      return { type: 'slice', start, stop, step };
    },
    parseAtom() {
      const k = this.peek();
      if (k.t === 'num') { this.p++; return { type: 'const', v: k.v }; }
      if (k.t === 'str') {
        this.p++;
        let v = k.v;
        while (this.peek().t === 'str') { v += this.peek().v; this.p++; }
        return { type: 'const', v };
      }
      if (k.t === 'fstr') { this.p++; return { type: 'fstr', parts: parseFString(k.v) }; }
      if (k.t === 'name') {
        if (UNSUPPORTED.includes(k.v)) throw new PyError('SimulatorLimit', `'${k.v}' isn't part of this training ground — try it in real Python!`);
        this.p++;
        if (k.v === 'True') return { type: 'const', v: true };
        if (k.v === 'False') return { type: 'const', v: false };
        if (k.v === 'None') return { type: 'const', v: null };
        return { type: 'name', id: k.v };
      }
      if (this.isOp('(')) { this.p++; const e = this.parseExpr(); this.expect(')', '('); return e; }
      if (this.isOp('[')) {
        this.p++;
        const items = [];
        while (!this.isOp(']')) {
          items.push(this.parseExpr());
          if (!this.eat(',')) break;
        }
        this.expect(']', '[');
        return { type: 'list', items };
      }
      if (k.t === 'eof') throw new PyError('SyntaxError', 'incomplete — something is missing at the end');
      throw new PyError('SyntaxError', `invalid syntax near ${tokText(k)}`);
    }
  };

  function parseFString(s) {
    const parts = [];
    let buf = '', i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === '{' && s[i + 1] === '{') { buf += '{'; i += 2; continue; }
      if (c === '}' && s[i + 1] === '}') { buf += '}'; i += 2; continue; }
      if (c === '{') {
        let depth = 0, j = i + 1, expr = '';
        for (; j < s.length; j++) {
          const d = s[j];
          if ('[('.includes(d)) depth++;
          if ('])'.includes(d)) depth--;
          if (d === '}' && depth <= 0) break;
          if (d === ':' && depth <= 0) { while (j < s.length && s[j] !== '}') j++; break; }
          expr += d;
        }
        if (j >= s.length) throw new PyError('SyntaxError', "f-string: expecting '}'");
        if (buf) { parts.push(buf); buf = ''; }
        const p = new Parser(tokenize(expr));
        const node = p.parseExpr();
        if (p.peek().t !== 'eof') throw new PyError('SyntaxError', 'f-string: invalid syntax');
        parts.push(node);
        i = j + 1; continue;
      }
      buf += c; i++;
    }
    if (buf) parts.push(buf);
    return parts;
  }

  /* ---------------- values ---------------- */
  function typeName(v) {
    if (v === null) return 'NoneType';
    if (typeof v === 'boolean') return 'bool';
    if (typeof v === 'number') return 'int';
    if (v instanceof PyFloat) return 'float';
    if (typeof v === 'string') return 'str';
    if (Array.isArray(v)) return 'list';
    if (v && v.__fn) return 'builtin_function_or_method';
    return 'object';
  }
  const isIntV = v => typeof v === 'number' || typeof v === 'boolean';
  const toInt = v => typeof v === 'boolean' ? (v ? 1 : 0) : v;
  const isNum = v => isIntV(v) || v instanceof PyFloat;
  const numOf = v => v instanceof PyFloat ? v.v : toInt(v);

  function pyRepr(v) {
    if (v === null) return 'None';
    if (v === true) return 'True';
    if (v === false) return 'False';
    if (typeof v === 'number') return String(v);
    if (v instanceof PyFloat) return Number.isInteger(v.v) ? v.v.toFixed(1) : String(v.v);
    if (typeof v === 'string') {
      const q = (v.includes("'") && !v.includes('"')) ? '"' : "'";
      let s = v.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t');
      if (q === "'") s = s.replace(/'/g, "\\'");
      return q + s + q;
    }
    if (Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']';
    if (v && v.__fn) return `<built-in function ${v.name}>`;
    return String(v);
  }
  const pyStr = v => typeof v === 'string' ? v : pyRepr(v);

  function pyEq(a, b) {
    if (isNum(a) && isNum(b)) return numOf(a) === numOf(b);
    if (typeof a === 'string' && typeof b === 'string') return a === b;
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => pyEq(x, b[i]));
    return a === b;
  }
  // strict: same Python type all the way down (so '4' != 4 and True != 1)
  function strictEq(a, b) {
    if (typeName(a) !== typeName(b)) return false;
    if (Array.isArray(a)) return a.length === b.length && a.every((x, i) => strictEq(x, b[i]));
    return pyEq(a, b);
  }
  function pyLt(a, b, op) {
    if (isNum(a) && isNum(b)) return numOf(a) < numOf(b);
    if (typeof a === 'string' && typeof b === 'string') return a < b;
    if (Array.isArray(a) && Array.isArray(b)) {
      for (let i = 0; i < Math.min(a.length, b.length); i++) {
        if (!pyEq(a[i], b[i])) return pyLt(a[i], b[i], op);
      }
      return a.length < b.length;
    }
    throw new PyError('TypeError', `'${op}' not supported between instances of '${typeName(a)}' and '${typeName(b)}'`);
  }

  /* ---------------- indexing & slicing ---------------- */
  function seqWord(v) { return typeof v === 'string' ? 'string' : 'list'; }
  function checkSeq(obj) {
    const tn = typeName(obj);
    if (tn !== 'str' && tn !== 'list') throw new PyError('TypeError', `'${tn}' object is not subscriptable`);
  }
  function doIndex(obj, i) {
    checkSeq(obj);
    if (!isIntV(i)) {
      if (typeof obj === 'string') throw new PyError('TypeError', `string indices must be integers, not '${typeName(i)}'`);
      throw new PyError('TypeError', `list indices must be integers or slices, not ${typeName(i)}`);
    }
    const n = obj.length;
    let j = toInt(i);
    if (j < 0) j += n;
    if (j < 0 || j >= n) throw new PyError('IndexError', `${seqWord(obj)} index out of range`);
    return { value: obj[j], indices: [j] };
  }
  function sliceIndices(n, start, stop, step) {
    if (step === 0) throw new PyError('ValueError', 'slice step cannot be zero');
    const lower = step > 0 ? 0 : -1, upper = step > 0 ? n : n - 1;
    const adj = (v, dflt) => {
      if (v === null) return dflt;
      if (v < 0) { v += n; if (v < lower) v = lower; }
      else if (v > upper) v = upper;
      return v;
    };
    const s = adj(start, step < 0 ? upper : lower);
    const e = adj(stop, step < 0 ? lower : upper);
    const out = [];
    if (step > 0) for (let i = s; i < e; i += step) out.push(i);
    else for (let i = s; i > e; i += step) out.push(i);
    return { indices: out, start: s, stop: e, step };
  }
  function doSlice(obj, start, stop, step) {
    checkSeq(obj);
    for (const v of [start, stop, step]) {
      if (v !== null && !isIntV(v)) throw new PyError('TypeError', 'slice indices must be integers or None or have an __index__ method');
    }
    const r = sliceIndices(obj.length, start === null ? null : toInt(start), stop === null ? null : toInt(stop), step === null ? 1 : toInt(step));
    const picked = r.indices.map(i => obj[i]);
    return Object.assign(r, { value: typeof obj === 'string' ? picked.join('') : picked });
  }

  /* ---------------- operators ---------------- */
  function binop(op, a, b) {
    if (isNum(a) && isNum(b)) {
      const fl = a instanceof PyFloat || b instanceof PyFloat;
      const x = numOf(a), y = numOf(b);
      const wrap = v => fl ? new PyFloat(v) : v;
      switch (op) {
        case '+': return wrap(x + y);
        case '-': return wrap(x - y);
        case '*': return wrap(x * y);
        case '/': if (y === 0) throw new PyError('ZeroDivisionError', 'division by zero'); return new PyFloat(x / y);
        case '//': if (y === 0) throw new PyError('ZeroDivisionError', 'integer division or modulo by zero'); return wrap(Math.floor(x / y));
        case '%': if (y === 0) throw new PyError('ZeroDivisionError', 'integer modulo by zero'); return wrap(((x % y) + y) % y);
      }
    }
    if (op === '+') {
      if (typeof a === 'string' && typeof b === 'string') return a + b;
      if (Array.isArray(a) && Array.isArray(b)) return a.concat(b);
      if (typeof a === 'string') throw new PyError('TypeError', `can only concatenate str (not "${typeName(b)}") to str`);
      if (Array.isArray(a)) throw new PyError('TypeError', `can only concatenate list (not "${typeName(b)}") to list`);
    }
    if (op === '*') {
      if ((typeof a === 'string' || Array.isArray(a)) && isIntV(b)) return repeat(a, toInt(b));
      if ((typeof b === 'string' || Array.isArray(b)) && isIntV(a)) return repeat(b, toInt(a));
    }
    throw new PyError('TypeError', `unsupported operand type(s) for ${op}: '${typeName(a)}' and '${typeName(b)}'`);
  }
  function repeat(seq, n) {
    if (typeof seq === 'string') return n > 0 ? seq.repeat(Math.min(n, 10000)) : '';
    let out = [];
    for (let i = 0; i < Math.min(n, 10000); i++) out = out.concat(seq);
    return out;
  }
  function compare(op, a, b) {
    switch (op) {
      case '==': return pyEq(a, b);
      case '!=': return !pyEq(a, b);
      case '<': return pyLt(a, b, op);

  function splitLogicalLines(src) {

    const out = [];

<script>
/* Slice & Score — app UI */
(function () {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escAttr = s => esc(s).replace(/"/g, '&quot;');
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- state ---------- */
  const STORE_KEY = 'slice-and-score-v2';
  const defaults = () => ({ cur: 0, solved: {}, predicted: {}, checks: {}, projectCode: null, projectDone: {}, quiz: null, quizBest: 0, coach: false });
  let state = defaults();
  try { state = Object.assign(defaults(), JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { /* private mode */ }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };

  /* ---------- environments ---------- */
  const BASE_ENV = {}; Py.run(BASE_ENV_SRC, BASE_ENV);
  const QUIZ_ENV = {}; Py.run(QUIZ_DATA, QUIZ_ENV);
  const PROJ_ENV = {}; Py.run(PROJECT_DATA, PROJ_ENV);
  const envCopy = (e = BASE_ENV) => Object.assign({}, e);
  const valueOf = (expr, env = BASE_ENV) => Py.run(expr, envCopy(env)).value;

  const PAGES = [
    ...MISSIONS.map(m => ({ kind: 'mission', m, tab: m.tab, id: m.id })),
    { kind: 'project', tab: 'Project', id: 'proj' },
    { kind: 'quiz', tab: 'Quiz', id: 'quiz' },
  ];
  const TOTAL_CHAL = MISSIONS.reduce((n, m) => n + m.challenges.length, 0);
  const MAX_GOALS = TOTAL_CHAL + PROJECT_TASKS.length + QUIZ.length;

  function goals() {
    return Object.keys(state.solved).length + Object.keys(state.projectDone).length + Math.min(state.quizBest || 0, QUIZ.length);
  }
  function missionDone(m) { return m.challenges.every((_, i) => state.solved[m.id + ':' + i]); }
  function pageDone(p) {
    if (p.kind === 'mission') return missionDone(p.m);
    if (p.kind === 'project') return PROJECT_TASKS.filter(t => !t.bonus).every(t => state.projectDone[t.id]);
    return !!(state.quiz && state.quiz.finished);
  }

  /* ---------- friendly error tips ---------- */
  function coachTip(err) {
    const t = err.pyType, m = err.pyMsg || '';
    if (t === 'IndexError') return 'Out of play! That index is past the end of the line. Valid indexes go from 0 to len − 1 (or −1 back to −len).';
    if (t === 'NameError') { const nm = (m.match(/'(.+)'/) || [])[1]; return `Python doesn't know “${nm}”. Check the spelling (capitals matter!). Text needs quotes.`; }
    if (t === 'TypeError' && /indices must be integers/.test(m)) return "Indexes must be whole numbers like 3, not text like '3' and not 1.5.";
    if (t === 'TypeError' && /concatenate|unsupported operand/.test(m)) return "You're mixing text and numbers. int() turns text into a number; str() turns a number into text.";
    if (t === 'TypeError' && /not subscriptable/.test(m)) return 'You can only use [ ] on lists and strings, not on numbers.';
    if (t === 'TypeError' && /not callable/.test(m)) return 'Round brackets ( ) call a function. To pick an item, use square brackets [ ].';
    if (t === 'ValueError' && /step cannot be zero/.test(m)) return 'A step of 0 means you never move! Use 1, 2, −1 …';
    if (t === 'ValueError' && /invalid literal for int/.test(m)) return "int() can only turn digit text like '3' into a number.";
    if (t === 'SyntaxError' && /never closed/.test(m)) return 'A bracket was opened but never closed. Count your [ ] and ( ).';
    if (t === 'SyntaxError' && /unterminated|quote/.test(m)) return 'A quote is missing. Text needs a quote at both ends: "like this".';
    if (t === 'SyntaxError' && /parentheses/.test(m)) return 'In Python 3, print needs brackets: print(squad[0])';
    if (t === 'SyntaxError') return "Python can't read that. Check your brackets, colons, commas and quotes.";
    if (t === 'IndentationError') return 'Remove the spaces at the start of the line.';
    if (t === 'SimulatorLimit') return 'This training ground focuses on indexing & slicing.';
    return 'Read the last line of the error. It tells you what went wrong.';
  }
  const errLine = (e, withLine) => (withLine && e.line ? `Line ${e.line}: ` : '') + `${e.pyType}: ${e.pyMsg}`;

  /* ---------- tiny syntax highlighter ---------- */
  const HL_CONST = new Set(['None', 'True', 'False']);
  const HL_FUNC = new Set(['print', 'len', 'int', 'str', 'sum', 'max', 'min', 'abs', 'list']);
  const HL_KW = new Set(['for', 'in', 'if', 'elif', 'else', 'while', 'def', 'return', 'import', 'from', 'and', 'or', 'not']);
  // Colours one line of Python: comments, strings, numbers, keywords, built-ins, brackets
  function hlLine(line) {
    let out = '', i = 0;
    const span = (cls, text) => `<span class="${cls}">${esc(text)}</span>`;
    while (i < line.length) {
      const c = line[i];
      if (c === '#') { out += span('c', line.slice(i)); break; }
      const isF = (c === 'f' || c === 'F') && (line[i + 1] === '"' || line[i + 1] === "'") && !/\w/.test(line[i - 1] || '');
      if (c === '"' || c === "'" || isF) {
        const q = isF ? line[i + 1] : c;
        let j = i + (isF ? 2 : 1);
        while (j < line.length && line[j] !== q) j += line[j] === '\\' ? 2 : 1;
        out += span('s', line.slice(i, Math.min(j + 1, line.length)));
        i = j + 1; continue;
      }
      if (/\d/.test(c) && !/\w/.test(line[i - 1] || '')) {
        const m = line.slice(i).match(/^\d[\d_]*(\.\d+)?/)[0];
        out += span('n', m); i += m.length; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        const w = line.slice(i).match(/^\w+/)[0];
        const after = line.slice(i + w.length).match(/^\s*\(/);
        const cls = HL_CONST.has(w) ? 'k' : HL_KW.has(w) ? 'kw' : (HL_FUNC.has(w) && after) ? 'f' : '';
        out += cls ? span(cls, w) : esc(w); i += w.length; continue;
      }
      if ('[]()'.includes(c)) { out += span('b', c); i++; continue; }
      out += esc(c); i++;
    }
    return out;
  }

  /* ---------- animation ---------- */
  let animToken = 0;
  function placeBall(container, ball, target, dy) {
    const cr = container.getBoundingClientRect(), r = target.getBoundingClientRect();
    const x = r.left - cr.left + r.width / 2 - 12;
    const y = dy ? r.top - cr.top + r.height / 2 - 12 : r.top - cr.top - 22;
    if (dy === 'left') { ball.style.transform = `translate(${r.left - cr.left - 22}px,${y}px)`; ball.classList.add('on'); return; }
    ball.style.transform = `translate(${x}px,${y}px)`;
    ball.classList.add('on');
  }
  function resetViz(viz) {
    $$('.chip', viz).forEach(c => { c.classList.remove('dim', 'picked', 'is-start', 'is-stop'); const o = $('.ord', c); if (o) o.remove(); });
    $$('.trow', viz).forEach(r => r.classList.remove('dim', 'picked'));
    $$('.cell', viz).forEach(c => c.classList.remove('hit'));
    $$('.endzone', viz).forEach(z => { z.classList.remove('hit', 'stop-here'); z.textContent = z.classList.contains('l') ? '◀ out' : 'out ▶'; });
    const t = $('.track', viz); if (t) t.classList.remove('has-markers');
    const b = $('.ball', viz); if (b) b.classList.remove('on');
    $('.viz-result', viz).innerHTML = '';
  }
  async function animate(root, res, code) {
    const my = ++animToken;
    $$('.viz', root).forEach(resetViz);
    const trace = res.trace || [];
    const has = n => root.querySelector(`.viz[data-var="${n}"]`);
    let rec = [...trace].reverse().find(r => r.depth === 0 && has(r.name));
    const recT = trace.filter(r => r.name === 'table');
    if (recT.length && has('table')) rec = recT[0];
    let text;
    if (!res.ok) text = `<b>${esc(code)}</b> → <b>${esc(res.error.pyType)}</b>`;
    else text = `<b>${esc(code)}</b> → <b>${esc(res.value === undefined ? '' : Py.repr(res.value))}</b>`;
    if (!rec) {
      const v = $('.viz', root);
      if (v) { $('.viz-result', v).innerHTML = text; $('.viz-result', v).classList.toggle('err', !res.ok); }
      return;
    }
    const viz = has(rec.name);
    const out = $('.viz-result', viz);
    out.classList.toggle('err', !res.ok);
    out.innerHTML = '<span style="opacity:.6">⚽ …</span>';
    if (rec.name === 'table') await animTable(viz, recT, my);
    else await animStrip(viz, rec, my);
    if (my === animToken) out.innerHTML = text;
  }
  async function animStrip(viz, rec, my) {
    const chips = $$('.chip', viz), track = $('.track', viz), ball = $('.ball', viz);
    const n = chips.length;
    chips.forEach(c => c.classList.add('dim'));
    if (rec.error) {
      if (rec.kind === 'index' && rec.attempted !== null && rec.attempted !== undefined) {
        const zone = $(rec.attempted >= 0 ? '.endzone.r' : '.endzone.l', viz);
        placeBall(track, ball, zone);
        await sleep(350);
        zone.classList.add('hit'); zone.textContent = `[${rec.attempted}] OUT!`;
      }
      return;
    }
    const idx = rec.indices;
    if (rec.kind === 'slice') {
      track.classList.add('has-markers');
      if (idx.length) chips[idx[0]].classList.add('is-start');
      if (rec.stop >= 0 && rec.stop < n) chips[rec.stop].classList.add('is-stop');
      else { const z = $(rec.stop >= n ? '.endzone.r' : '.endzone.l', viz); z.classList.add('stop-here'); z.textContent = 'STOP ✋'; }
    }
    const dt = idx.length > 8 ? 190 : idx.length > 4 ? 260 : 340;
    for (let k = 0; k < idx.length; k++) {
      if (my !== animToken) return;
      const c = chips[idx[k]];
      placeBall(track, ball, c);
      await sleep(k === 0 ? 380 : dt);
      if (my !== animToken) return;
      c.classList.remove('dim'); c.classList.add('picked');
      if (rec.kind === 'slice') c.insertAdjacentHTML('beforeend', `<span class="ord">${k + 1}</span>`);
    }
    if (!idx.length) {
      const z = $('.endzone.r', viz);
      placeBall(track, ball, chips.length ? chips[Math.max(0, Math.min(n - 1, rec.start))] : z);
    }
  }
  async function animTable(viz, recs, my) {
    const rows = $$('.trow:not(.head)', viz), box = $('.tbl', viz), ball = $('.ball', viz);
    rows.forEach(r => r.classList.add('dim'));
    const d0 = recs.find(r => r.depth === 0), d1 = recs.find(r => r.depth === 1);
    if (!d0 || d0.error) return;
    for (let k = 0; k < d0.indices.length; k++) {
      if (my !== animToken) return;
      const row = rows[d0.indices[k]];
      placeBall(box, ball, $('.ix', row), 'mid');
      await sleep(k === 0 ? 380 : 260);
      row.classList.remove('dim'); row.classList.add('picked');
    }
    if (d1 && !d1.error && d1.kind === 'index' && my === animToken) {
      const cell = $(`.cell[data-c="${d1.indices[0]}"]`, rows[d1.row]);
      if (cell) { placeBall(box, ball, cell, 'left'); await sleep(350); cell.classList.add('hit'); }
    }
  }

  /* ---------- mission wiring ---------- */
  function wireMission(m) {

      log.insertAdjacentHTML('beforeend', html);
      log.scrollTop = log.scrollHeight;
      animate(ground, res, code);
    };
    $('#consoleRun').onclick = () => runConsole(input.value);
    input.onkeydown = e => { if (e.key === 'Enter') { runConsole(input.value); input.select(); } };
    $$('.quick button', ground).forEach(b => b.onclick = () => { input.value = b.dataset.q; runConsole(b.dataset.q); });

    if (m.lab) wireLab(m, ground);

    // predictions

      };

      $$('.opt', box).forEach(b => b.onclick = () => { const j = +b.dataset.o; state.predicted[key] = j; save(); show(j); });
    });

    // challenges

      const i = +box.dataset.c, c = m.challenges[i], key = m.id + ':' + i;

        const wrap = $('.chal-hints', box);

  function wireLab(m, ground) {
    const lab = { v: m.lab.vars[0], start: null, stop: null, step: null };
    const codeEl = $('.lab-code', ground);
    const len = () => BASE_ENV[lab.v].length;
    const code = () => `${lab.v}[${lab.start ?? ''}:${lab.stop ?? ''}${lab.step !== null ? ':' + lab.step : ''}]`;
    const paint = () => {
      $$('.stepper', ground).forEach(s => {
        const k = s.dataset.k, v = lab[k], el = $('.val', s);
        el.textContent = v === null ? '—' : v;
        el.classList.toggle('blank', v === null);
      });
      codeEl.textContent = code();
    };
    const kick = () => { const c = code(); animate(ground, Py.run(c, envCopy(), { repl: true }), c); };
    $$('.stepper', ground).forEach(s => {
      const k = s.dataset.k;
      $$('button', s).forEach(b => b.onclick = () => {
        const d = +b.dataset.d;
        if (d === 0) lab[k] = null;
        else if (lab[k] === null) lab[k] = k === 'step' ? d : k === 'stop' ? len() : 0;
        else {
          const lim = len() + 2;
          let v = lab[k] + d;
          if (k === 'step' && v === 0) v += d;
          if (k === 'step') v = Math.max(-4, Math.min(4, v)); else v = Math.max(-lim, Math.min(lim, v));
          lab[k] = v;
        }
        paint(); kick();
      });
    });
    $$('.seg button', ground).forEach(b => b.onclick = () => {
      lab.v = b.dataset.v; $$('.seg button', ground).forEach(x => x.classList.toggle('on', x === b));
      paint(); kick();
    });
    $('.lab-kick', ground).onclick = kick;
    paint();
  }

  /* ---------- judging an answer ---------- */
  function judge(c, code, env) {
    const res = Py.run(code, envCopy(env), { repl: true });
    let outHTML = '';
    if (res.out.length) outHTML += `<span class="val">${esc(res.out.join('\n'))}</span>`;
    if (!res.ok) outHTML += `<span class="err">${esc(errLine(res.error))}</span>`;
    const rulesBroken = () => {
      for (const r of c.must || []) if (!new RegExp(r.re).test(code)) return r.msg;
      for (const r of c.mustNot || []) if (new RegExp(r.re).test(code)) return r.msg;
      if (c.maxBrackets && (code.match(/\[/g) || []).length > c.maxBrackets) return `Only ${c.maxBrackets} pair of [ ]`;
      return null;
    };
    if (c.expectError) {
      if (!res.ok && res.error.pyType === c.expectError) {
        const b = rulesBroken();
        if (b) return { res, outHTML, cls: 'near', msg: `🟨 The whistle blew, but the coach said: <b>${esc(b)}</b>.` };
        return { res, outHTML, cls: 'good', msg: '⚽ GOAL! Phweeet! You found the edge of the pitch.' };
      }
      if (!res.ok) return { res, outHTML, cls: 'bad', msg: `That's a ${esc(res.error.pyType)}, not an ${esc(c.expectError)}. ${esc(coachTip(res.error))}` };
      return { res, outHTML, cls: 'bad', msg: 'No whistle. That index exists! Try one that is off the pitch.' };
    }
    if (!res.ok) return { res, outHTML, cls: 'bad', msg: '🗣️ ' + esc(coachTip(res.error)) };
    if (res.value === undefined) return { res, outHTML, cls: 'bad', msg: 'Type an expression that gives a value, like <code>squad[0]</code> (no <code>=</code> needed here).' };
    const target = Py.run(c.a, envCopy(env)).value;
    if (Py.strictEq(res.value, target)) {
      if (/["']/.test(code) && !/["']/.test(c.a)) return { res, outHTML, cls: 'near', msg: '🟨 Right value, but you typed the answer by hand! Use indexing on the data instead.' };
      const b = rulesBroken();
      if (b) return { res, outHTML, cls: 'near', msg: `🟨 Right answer, but the coach's rule is: <b>${esc(b)}</b>. Try again!` };
      return { res, outHTML, cls: 'good', msg: '⚽ GOAL! Great finish.' };
    }
    return { res, outHTML, cls: 'bad', msg: nudge(res.value, target) };
  }
  // true when got has the same items as want, but in the opposite order
  function isBackwards(got, want) {
    const tg = Py.typeName(got);
    if (tg !== Py.typeName(want) || (tg !== 'str' && tg !== 'list') || want.length < 2) return false;
    const rev = tg === 'str' ? [...want].reverse().join('') : want.slice().reverse();
    return Py.strictEq(got, rev) && !Py.strictEq(got, want);
  }
  function nudge(got, want) {
    const tg = Py.typeName(got), tw = Py.typeName(want);
    if (isBackwards(got, want)) return `🔄 Right ${tg === 'str' ? 'characters' : 'items'}, but <b>backwards</b>! The coach wants them in the same order as the data. Do you need that negative step?`;
    if (tg !== tw && Py.str(got) === Py.str(want)) return `So close! You got the <b>${tg}</b> ${esc(Py.repr(got))}, but the coach wants the <b>${tw}</b> ${esc(Py.repr(want))}.`;
    if (tg === 'list' && tw !== 'list' && got.length === 1 && Py.strictEq(got[0], want)) return 'Nearly! A slice gives a <b>list</b>. To get one item on its own, use a single index.';
    if (tw === 'list' && tg !== 'list') return 'The coach wants a <b>list</b> of players. Use a slice with a colon <code>:</code>.';
    if (tw === 'list' && tg === 'list') {
      if (got.length === want.length + 1 || got.length === want.length - 1) return `You picked ${got.length} item${got.length === 1 ? '' : 's'}, and the coach wants ${want.length}. Check your <b>stop</b> (it's not included!).`;
      return `You picked ${got.length} item${got.length === 1 ? '' : 's'}, and the coach wants ${want.length}. Watch the ball in the picture!`;
    }
    if (tw === 'str' && tg === 'str' && want.length > 1 && got.length !== want.length) return `You got ${got.length} character${got.length === 1 ? '' : 's'}, and the coach wants ${want.length}. Check start and stop.`;
    return 'Not quite. Watch where the ball goes in the picture, then adjust.';
  }

  /* ---------- project ---------- */
  function projectHTML() {
    const tasks = PROJECT_TASKS.map(t => `<li class="task${t.bonus ? ' bonus' : ''}" data-t="${t.id}"><span class="ico">${t.bonus ? '⭐' : '○'}</span>
      <div><b class="ttl">${t.title}</b><p>${t.desc}</p><div class="tmsg"></div></div></li>`).join('');
    return `<div class="mission-tag">MISSION 05 · FINAL PROJECT</div><h1 class="mission-title">Matchday Analyst</h1>
      <p class="story">FC Python just beat the Tigers 4–2! You're the club's <b>data analyst</b>. The club computer gives you the squad, the form guide and today's result. Write a program that pulls out everything the coach needs, using <b>only indexing and slicing</b>, then print a match report.</p>
      <div class="board"><div class="board-h"><span>Your game plan</span><span>project</span></div><div class="board-flow">
        <div class="board-step"><div class="big">data</div><div class="lbl">Read the data</div><div class="s">don't change it!</div></div><div class="board-arrow">→</div>
        <div class="board-step"><div class="big">[ : ]</div><div class="lbl">Fill each variable</div><div class="s">replace every None</div></div><div class="board-arrow">→</div>
        <div class="board-step"><div class="big">print()</div><div class="lbl">Report</div><div class="s">at least 5 lines</div></div></div>
        <div class="think">Press "Run & check" often. Each task turns green when it's right. Typing the answers by hand doesn't count!</div></div>
      <div class="proj-grid">
        <section class="card"><div class="card-h"><h2>Tasks</h2><span class="sub" id="projCount"></span></div>
          <div class="meter"><i id="projMeter"></i></div><ul class="tasks" style="margin-top:12px">${tasks}</ul></section>
        <section class="card"><div class="card-h"><h2>matchday_analyst.py</h2><span class="sub">edit the code, then run it</span></div>
          <div class="editor"><div class="gutter" id="gutter" aria-hidden="true">1</div>
          <div class="code-wrap"><pre class="code-hl" id="projHl" aria-hidden="true"></pre>
          <textarea id="projCode" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Project code"></textarea></div></div>
          <div class="proj-bar"><button class="btn primary" id="projRun">Run &amp; check ▶</button>
            <button class="btn" id="projDownload">⬇ Download .py</button><button class="btn" id="projReset">↺ Reset code</button></div>
          <div class="kicker" style="margin-bottom:6px">Output</div><div class="terminal" id="projOut"><span class="muted">Press "Run &amp; check" to run your program.</span></div></section>
      </div>
      <section class="card"><div class="card-h"><h2>Now in Real Python</h2><span class="sub">finish the job like a real analyst</span></div>
        <ul class="check">${['Download your file (or copy it) and run it in your own Python editor. Does it print the same report?',
          'Change <code>result</code> to <code>"FCP 1-0 TIG"</code>. Does your report update by itself? (That\'s why we don\'t type answers by hand!)',
          'Add one more line of your own to the report, for example the bench players or the team in 3rd place.'].map((r, i) => `<li><label><input type="checkbox" data-chk="proj:${i}" ${state.checks['proj:' + i] ? 'checked' : ''}><span>${r}</span></label></li>`).join('')}</ul>
        <div class="checkpoint"><span class="kicker">Done when</span><span>All 7 tasks are green and your report prints in real Python.</span></div></section>
      ${coachHTML({
        time: '30–45 min', flow: ["Let the student work alone first. Only step in when they're stuck for 3+ minutes.", 'Encourage “Run & check” after every single task, not at the end.', 'When finished, do the real-Python checklist together, especially changing the result string.'],
        watch: ['Typing answers by hand (<code>keeper = "Nok"</code>). The checker flags this; talk about <i>why</i> data changes.', 'Captain = 11th player = index <b>10</b>.', 'Forgetting <code>int()</code> for the goals.'],
        ask: ['If a new player joins the bench, which of your variables still work without changes?'],
        extend: 'Bonus tasks: the penalty slice needs a negative step and a careful stop.',
      }, 'Project')}`;
  }
  function wireProject() {
    const ta = $('#projCode'), gutter = $('#gutter'), hlEl = $('#projHl');
    ta.value = state.projectCode || PROJECT_STARTER;
    const syncScroll = () => {
      gutter.scrollTop = ta.scrollTop;
      hlEl.scrollTop = ta.scrollTop;
      hlEl.scrollLeft = ta.scrollLeft;
    };
    const syncGutter = () => {
      const n = ta.value.split('\n').length;
      gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
      // trailing newline keeps the last (empty) line the same height as in the textarea
      hlEl.innerHTML = hl(ta.value) + '\n ';
      syncScroll();
    };
    let t;
    ta.addEventListener('input', () => { syncGutter(); clearTimeout(t); t = setTimeout(() => { state.projectCode = ta.value; save(); }, 400); });
    ta.addEventListener('scroll', syncScroll);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); syncGutter(); }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runProject(true); }
    });
    syncGutter();
    $('#projRun').onclick = () => runProject(true);
    $('#projReset').onclick = () => { if (confirm('Go back to the starter code? Your code will be replaced.')) { ta.value = PROJECT_STARTER; state.projectCode = null; save(); syncGutter(); runProject(false); } };
    $('#projDownload').onclick = () => {
      const blob = new Blob([ta.value], { type: 'text/x-python' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'matchday_analyst.py';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $$('[data-chk]').forEach(cb => cb.onchange = () => { state.checks[cb.dataset.chk] = cb.checked; save(); });
    runProject(false);
  }
  function looksHardcoded(rhs) {
    return /["']/.test(rhs) || /^\s*\[/.test(rhs) || /^[\d\s+\-*/().]+$/.test(rhs);
  }
  function runProject(user) {
    const code = $('#projCode').value;
    state.projectCode = code; save();
    const env = {};
    const res = Py.run(code, env, {});
    const out = $('#projOut');
    let html = res.out.length ? esc(res.out.join('\n')) : '<span class="muted">(nothing printed yet)</span>';
    if (!res.ok) html += `\n<span class="er">${esc(errLine(res.error, true))}\n🗣️ Coach: ${esc(coachTip(res.error))}</span>`;
    const changed = ['squad', 'form', 'result'].filter(k => !(k in env) || !Py.strictEq(env[k], PROJ_ENV[k]));
    if (changed.length) html += `\n<span class="er">⚠ The club data was changed or deleted: ${changed.join(', ')}. Put it back (or press Reset code).</span>`;
    out.innerHTML = html;

    let doneN = 0, newGoal = false;
    for (const t of PROJECT_TASKS) {
      const li = $(`.task[data-t="${t.id}"]`), msg = $('.tmsg', li), ico = $('.ico', li);
      let status = 'todo', text = '';
      if (t.print) {
        const n = res.out.length;
        if (n >= t.print) status = 'ok'; else text = `${n} / ${t.print} lines printed`;
      } else {
        const parts = Object.keys(t.ref).map(v => {
          const a = res.assigns[v];
          const want = valueOf(t.ref[v], PROJ_ENV);
          if (!a || a.value === null) return { v, s: 'todo' };
          if (!Py.strictEq(a.value, want)) {
            if (isBackwards(a.value, want)) return { v, s: 'bad', m: `🔄 ${v} has the right ${a.value.length}, but backwards! Keep the same order as the data. Do you need that negative step?` };
            const shown = Py.repr(a.value);
            return { v, s: 'bad', m: `Not quite: ${v} is ${shown.length > 44 ? shown.slice(0, 44) + '…' : shown}` };
          }
          if (looksHardcoded(a.rhs)) return { v, s: 'warn', m: `${v}: right value, but typed by hand. Use indexing!` };
          return { v, s: 'ok' };
        });
        if (parts.every(p => p.s === 'ok')) status = 'ok';
        else if (parts.some(p => p.s === 'warn')) status = 'warn';
        else if (parts.some(p => p.s === 'bad')) status = 'bad';
        text = parts.filter(p => p.m).map(p => p.m).join(' ');
        if (status !== 'ok' && !text && parts.some(p => p.s === 'ok')) text = 'Half-way there!';
      }
      if (changed.length && status === 'ok') { status = 'warn'; text = 'Restore the club data first.'; }
      li.className = `task${t.bonus ? ' bonus' : ''} ${status}`;
      ico.textContent = status === 'ok' ? '✓' : status === 'warn' ? '!' : status === 'bad' ? '✗' : (t.bonus ? '⭐' : '○');
      msg.textContent = text;
      if (status === 'ok') {
        doneN++;
        if (!state.projectDone[t.id]) { state.projectDone[t.id] = true; newGoal = true; }
      }
    }
    save();
    $('#projCount').textContent = `${doneN} / ${PROJECT_TASKS.length} done`;
    $('#projMeter').style.width = Math.round(100 * doneN / PROJECT_TASKS.length) + '%';
    if (newGoal && user) celebrate(); else { renderScore(); renderTabs(); }
  }

  /* ---------- quiz ---------- */
  function quizState() {
    if (!state.quiz || state.quiz.n !== QUIZ.length) state.quiz = { i: 0, answers: [], finished: false, n: QUIZ.length };
    return state.quiz;
  }
  function rating(s, n) {
    if (s === n) return ['🏆', "Ballon d'Or", 'A perfect score. You are an indexing legend!'];
    if (s >= n - 1) return ['🥇', 'Golden Boot', 'Brilliant! Just one tiny slip.'];
    if (s >= n - 3) return ['⭐', 'Player of the Match', 'Great game. Check the ones you missed.'];
    if (s >= n / 2) return ['👕', 'First Team', 'Solid! Replay the missions where you slipped.'];
    if (s >= 2) return ['🏃', 'Training Squad', 'Good effort. Revisit Missions 02 and 03, then try again.'];
    return ['🎒', 'Academy', 'Everyone starts here! Rewatch the replays and give it another go.'];
  }
  function quizHTML() {
    const qs = quizState();
    const dots = QUIZ.map((_, i) => { const a = qs.answers[i]; return `<i class="${a ? (a.ok ? 'r' : 'w') : i === qs.i && !qs.finished ? 'now' : ''}"></i>`; }).join('');
    let body;
    if (qs.finished) {
      const score = qs.answers.filter(a => a && a.ok).length;
      const [icon, title, line] = rating(score, QUIZ.length);
      body = `<div class="result-hero"><div class="trophy">${icon}</div><div class="kicker">Full time</div><div class="big">${score} / ${QUIZ.length}</div>
        <h2 style="font-size:30px;text-transform:uppercase">${title}</h2><p>${line}</p><button class="btn primary" id="quizAgain">Play again ↺</button></div>
        <h3 class="kicker" style="margin:10px 0">Match review</h3>
        <ul class="review">${QUIZ.map((q, i) => { const a = qs.answers[i] || {}; return `<li class="${a.ok ? '' : 'w'}">${a.ok ? '✅' : '❌'} <b>Q${i + 1}.</b> ${q.q} ${a.ok ? '' : `<br><span>Your answer: <code>${esc(a.given || '—')}</code> · Answer: <code>${esc(answerText(q))}</code></span>`}</li>`; }).join('')}</ul>`;
    } else {
      const q = QUIZ[qs.i];
      const typeLbl = q.t === 'mcq' ? 'Pick one' : q.t === 'text' ? 'Type the result' : 'Write the code';
      let input;
      if (q.t === 'mcq') input = `<div class="qopts">${q.opts.map((o, j) => `<button class="opt" data-o="${j}">${esc(o)}</button>`).join('')}</div>`;
      else input = `<div class="chal-row"><span class="prompt-sym" style="color:var(--grass)">${q.t === 'code' ? '&gt;&gt;&gt;' : '→'}</span>
        <input class="code-in" id="qIn" style="background:#fff;color:var(--ink);border:2px solid var(--line)" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="${q.t === 'code' ? 'e.g. team[0]' : "e.g. 'ABC'"}" aria-label="Your answer">
        <button class="btn dark" id="qCheck">Check</button></div>${q.must || q.maxBrackets ? `<div class="rules-tags" style="margin-top:8px">${(q.must || []).map(r => `<span class="rtag">📏 ${esc(r.msg)}</span>`).join('')}${q.maxBrackets ? '<span class="rtag">📏 One pair of [ ]</span>' : ''}</div>` : ''}`;
      body = `<div class="kicker">Question ${qs.i + 1} of ${QUIZ.length} · ${typeLbl}</div><div class="qtext">${q.q}</div>${input}
        <div class="qexp" id="qExp"></div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn primary" id="qNext" hidden>${qs.i === QUIZ.length - 1 ? 'See the result 🏁' : 'Next question →'}</button></div>`;
    }
    return `<div class="mission-tag">MISSION 06 · FINAL WHISTLE</div><h1 class="mission-title">The Big Quiz</h1>
      <p class="story">${QUIZ.length} questions to check your skills. New team, new data, same rules. No simulator to help you this time, so think it through!</p>
      <section class="card"><div class="card-h"><h2>Today's data</h2><span class="sub">all questions use these variables</span></div><pre class="code">${hl(QUIZ_DATA)}</pre>
        <div style="font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px">team:  0=Ana 1=Bo 2=Cy 3=Dan 4=Eve 5=Fin 6=Gus  ·  word: 7 letters</div></section>
      <section class="card quiz-card"><div class="qdots">${dots}</div>${body}</section>
      ${coachHTML({ time: '15 min', flow: ['Let the student do the quiz alone, without the Training Ground.', 'Afterwards, go through the Match review together. For each ❌, ask them to explain the right answer.'], watch: ['Q5 (<code>team[:1]</code> vs <code>team[0]</code>): list vs single item is a common confusion.', 'Q6: the stop is not included.'], ask: ['Which question was hardest, and why?'] }, 'Quiz')}`;
  }
  function answerText(q) { return q.t === 'mcq' ? q.opts[q.a] : q.t === 'text' ? Py.repr(valueOf(q.a, QUIZ_ENV)) : q.a; }
  function wireQuiz() {
    const qs = quizState();
    if (qs.finished) { $('#quizAgain').onclick = () => { state.quiz = { i: 0, answers: [], finished: false, n: QUIZ.length }; save(); render(); }; return; }
    const q = QUIZ[qs.i];
    const exp = $('#qExp'), next = $('#qNext');
    const finish = (ok, given, extra) => {
      qs.answers[qs.i] = { ok, given };
      exp.className = 'qexp show';
      exp.innerHTML = `${ok ? '✅ <b>Correct!</b>' : `❌ <b>Not this time.</b> Answer: <code>${esc(answerText(q))}</code>.`} ${extra || ''} ${q.why}`;
      next.hidden = false; next.focus();
      save();
    };
    if (q.t === 'mcq') {
      $$('.qopts .opt').forEach(b => b.onclick = () => {
        const j = +b.dataset.o;
        $$('.qopts .opt').forEach((x, k) => { x.disabled = true; if (k === q.a) x.classList.add('right'); else if (k === j) x.classList.add('wrong'); });
        finish(j === q.a, q.opts[j]);
      });
    } else {
      const inp = $('#qIn');
      const check = () => {
        const given = inp.value.trim(); if (!given) return;
        inp.disabled = true; $('#qCheck').disabled = true;
        const want = valueOf(q.a, QUIZ_ENV);
        if (q.t === 'text') {
          const r = Py.run(given, {}, {});
          const ok = (r.ok && r.value !== undefined && Py.strictEq(r.value, want)) || (typeof want === 'string' && given === want);
          finish(ok, given);
        } else {
          const r = judge({ a: q.a, must: q.must, maxBrackets: q.maxBrackets }, given, QUIZ_ENV);
          const usesData = /[A-Za-z_]\w*\s*\[/.test(given);
          const ok = r.cls === 'good' && usesData;
          const extra = r.res && r.res.ok && r.res.value !== undefined ? `Your code gave <code>${esc(Py.repr(r.res.value))}</code>.` : r.res && !r.res.ok ? `Your code gave <code>${esc(errLine(r.res.error))}</code>.` : '';
          finish(ok, given, extra + (r.cls === 'near' ? ' ' + r.msg.replace(/^🟨\s*/, '') : ''));
        }
      };
      $('#qCheck').onclick = check;
      inp.onkeydown = e => { if (e.key === 'Enter') check(); };
      inp.focus();
    }
    next.onclick = () => {
      if (qs.i < QUIZ.length - 1) qs.i++;
      else {
        qs.finished = true;
        const score = qs.answers.filter(a => a && a.ok).length;
        if (score > (state.quizBest || 0)) { state.quizBest = score; save(); render(); celebrate(); return; }
      }
      save(); render();
    };
  }

  /* ---------- global wiring ---------- */
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
  $('#prevBtn').onclick = () => go(state.cur - 1);
  $('#nextBtn').onclick = () => go(state.cur + 1);
  const coachBtn = $('#coachToggle');
  const paintCoach = () => { document.body.classList.toggle('coach-on', !!state.coach); coachBtn.innerHTML = `📋 <span class="coach-lbl">Coach notes: ${state.coach ? 'on' : 'off'}</span>`; coachBtn.title = 'Coach notes for the teacher'; coachBtn.setAttribute('aria-pressed', state.coach ? 'true' : 'false'); };
  coachBtn.onclick = () => { state.coach = !state.coach; save(); paintCoach(); if (state.coach) { const c = $('.coach'); if (c) c.scrollIntoView({ behavior: 'smooth' }); } };
  paintCoach();
  if (state.cur >= PAGES.length) state.cur = 0;
  render();
})();

</script>
</body>
</html>
